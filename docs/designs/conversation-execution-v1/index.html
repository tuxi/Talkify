<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>对话执行 · 五态设计</title>
<style>
:root{color-scheme:light;--bg:#fff;--surface:#f2f3f4;--text:#27282b;--muted:#73767c;--line:#e7e8eb;--blue:#2679d2;--green:#268145;--red:#b54141;font:15px/25px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--text);background:var(--bg)}
:root.dark{color-scheme:dark;--bg:#1f2023;--surface:#2b2d32;--text:#e8e9ed;--muted:#a4a8b1;--line:#393c43;--blue:#79b4f2;--green:#84c793;--red:#f09999}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}nav{min-height:58px;padding:12px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}nav b{margin-right:auto;font-weight:500}button{border:0;background:none;border-radius:7px;padding:6px 12px}nav button[aria-pressed=true]{background:var(--surface);color:var(--blue)}.app{height:calc(100vh - 58px);min-height:730px;display:flex;flex-direction:column;max-width:1120px;margin:auto}.toolbar{height:54px;display:flex;align-items:center;gap:10px;padding:0 28px;border-bottom:1px solid var(--line);font-size:14px}.toolbar small{margin-left:auto;color:var(--muted);font-size:12px}.reading{overflow:auto;flex:1;padding:28px 24px 16px}.column,.bottom{max-width:728px;margin:0 auto}.user{width:fit-content;max-width:86%;margin:0 0 40px auto;padding:14px 16px;background:var(--surface);border-radius:14px}.prose p{margin:0 0 14px}.history{margin:20px 0;color:var(--muted);font-size:13.5px;line-height:22px}.history summary{cursor:pointer}.history pre{white-space:pre-wrap;border:1px solid var(--line);padding:12px;border-radius:10px;font:12.5px/21px ui-monospace,Menlo,monospace}.tasks{margin:24px 0 18px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;line-height:22px}.tasks summary{padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}.tasks summary::-webkit-details-marker{display:none}.tasks summary b{font-weight:500}.count{color:var(--muted);font-variant-numeric:tabular-nums}.chev{margin-left:auto;color:var(--muted)}.tasks[open] .chev{transform:rotate(90deg)}.list{padding:0 14px 12px}.row{display:flex;gap:10px;padding:5px 0}.mark{width:16px;flex-shrink:0;text-align:center;color:var(--muted)}.done{color:var(--muted)}.done .mark{color:var(--green)}.current .mark,.activity .mark{color:var(--blue)}.activity{display:flex;gap:10px;font-size:13.5px;line-height:22px;color:var(--muted);margin:18px 0}.activity small{font-size:12px;margin-left:4px}.outcome{margin:20px 0;color:var(--red);font-size:13.5px;line-height:22px}.outcome details{margin-top:6px;color:var(--muted);font-size:12px}.outcome summary{cursor:pointer}.final-title{font-size:16px;line-height:24px;font-weight:600;margin:20px 0 10px}.bottom-wrap{padding:16px 24px 18px;background:var(--bg)}.request{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:13.5px;line-height:22px}.request p{margin:0 0 5px}.request small{color:var(--muted);font-size:12px}.request footer{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.request button{border:1px solid var(--line);font-size:13px;padding:5px 12px}.request .primary{background:var(--text);color:var(--bg);border-color:var(--text)}.composer{min-height:48px;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;padding:10px 14px;gap:16px}.composer .placeholder{flex:1;color:var(--muted)}.composer .stop{width:11px;height:11px;background:var(--text);border-radius:2px;margin:0 5px}.environment{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-top:9px;line-height:20px}.environment .model{margin-left:auto}.notes{padding:16px 24px;border-top:1px solid var(--line);font-size:12px;line-height:20px;color:var(--muted)}.notes span{display:block;max-width:728px;margin:auto}.muted{color:var(--muted)}.meta{font-size:12px;line-height:20px;color:var(--muted);margin-top:16px}.demo-message{font-size:12px;color:var(--muted);padding:0 16px 8px}.empty-task-note{color:var(--muted);font-size:12px;margin-top:20px}@media(max-width:640px){nav b{width:100%}.toolbar{padding-inline:18px}.reading{padding:20px 16px}.bottom-wrap{padding-inline:16px}.environment .workspace{display:none}.toolbar small{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.history summary{list-style:none}.history summary::-webkit-details-marker{display:none}
</style>
<nav aria-label="设计状态"><b>执行过程 V1 · 静态设计预览</b><button data-state="start">开始</button><button data-state="running">进行</button><button data-state="waiting">等待用户</button><button data-state="failed">失败</button><button data-state="complete">完成</button><button id="theme">深 / 浅色</button></nav>
<main class="app"><header class="toolbar">检查对话详情的显示 <span class="muted">⌄</span><small>同一任务 · 五种状态示意</small></header><div class="reading"><div class="column" id="content"></div></div><div class="bottom-wrap"><div class="bottom" id="bottom"></div></div><aside class="notes"><span id="note"></span></aside></main>
<script>
const states={
 start:{label:'开始',text:'我会先检查现有布局，再验证长消息、工具展示和主题切换。',activity:'正在处理',note:'先确认任务已开始。有真实 Tasks 更新后才显示清单；这里不编造计划。阶段 2 沿用现有运行中输入限制。'},
 running:{label:'进行',text:'正文和工具摘要的对齐已检查。接下来验证窄窗口及长消息的显示。',activity:'正在检查长消息的布局',elapsed:'24 秒',note:'模型计划与当前动作各司其职。Tasks 标题只保留名称和数量，当前动作表达一次；工具内部展示沿用专项实现。'},
 waiting:{label:'等待用户',text:'前两项检查已完成。接下来需要运行构建，继续验证页面显示。',activity:'等待你的确认',note:'等待审批时停止动态运行暗示，操作集中在输入框上方。正式产品复用已有审批组件和真实请求数据。'},
 failed:{label:'失败',text:'布局检查已完成，构建验证暂时未能完成。',note:'失败保留真实的 2/4；不把剩余项目涂成失败或完成。恢复操作是否可用取决于真实后端能力。'},
 complete:{label:'完成',text:'已完成检查。正文、工具摘要和输入框保持对齐，深浅主题下的信息层级一致。',note:'结果正文成为重点，运行状态消失。Tasks 默认收成一行，仍可展开；输入恢复普通发送。'}
};
const tasks=['检查正文与输入框对齐','检查工具摘要的外部间距','验证长消息与窄窗口','验证深浅主题与构建'];
function taskPanel(state){const n=state==='complete'?4:2;const open=['running','waiting'].includes(state);return `<details class="tasks" ${open?'open':''}><summary><b>Tasks</b><span class="count">${n}/4</span><span class="chev">›</span></summary><div class="list">${tasks.map((t,i)=>`<div class="row ${i<n?'done':i===n?'current':''}"><span class="mark">${i<n?'✓':i===n?'◉':'○'}</span><span>${t}</span></div>`).join('')}</div></details>`;}
function show(state){if(!states[state])state='running';const v=states[state];document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));let html=`<div class="user">帮我检查对话详情的显示，让文字更清晰，间距更舒服。</div><section class="prose"><p>${v.text}</p>`;
if(state!=='start')html+=`<details class="history"><summary>已检查 2 个文件与页面样式 ›</summary><pre>ConversationDetailView.swift\nconversation-appearance.css\n\n示例过程详情，正式实现沿用现有工具组件。</pre></details>`;
if(state==='complete')html+='<h3 class="final-title">验证结果</h3><p>长消息自然换行，正文保持稳定的阅读宽度。<br>工具过程按需展开，完成后的任务清单收成一行。</p>';
if(state!=='start')html+=taskPanel(state);
if(v.activity)html+=`<div class="activity"><span class="mark">${state==='waiting'?'○':'◉'}</span><span>${v.activity}${v.elapsed?`<small>· ${v.elapsed}</small>`:''}</span></div>`;
if(state==='failed')html+='<div class="outcome">构建验证未完成：本次执行未能访问所需的构建环境。<details><summary>查看详情</summary><p>示例错误，用于确认信息层级。已完成的检查保留，尚未执行的项目仍为待办。</p></details></div>';
if(state==='complete')html+='<div class="meta">用时 48 秒</div>';
html+='</section>';document.getElementById('content').innerHTML=html;
document.getElementById('bottom').innerHTML=(state==='waiting'?'<section class="request" aria-label="构建审批示例"><p>是否允许运行 macOS 构建？</p><small>在当前工作区执行构建，确认最终资源能够集成。</small><footer><button data-demo="denied">拒绝</button><button class="primary" data-demo="allowed">允许一次</button></footer></section>':'')+`<div class="composer"><span class="muted">＋</span><span class="placeholder">${['complete','failed'].includes(state)?'输入消息…':state==='waiting'?'等待上方操作':'正在执行任务…'}</span>${['complete','failed'].includes(state)?'<span class="muted">↵</span>':'<span class="stop" aria-label="停止任务示意"></span>'}</div><div class="environment"><span>⌘ 此电脑</span><span class="workspace">▱ chater</span><span class="model">deepseek-flash</span><span>Ask</span></div>`;
document.getElementById('note').textContent=v.note;document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{show(b.dataset.demo==='allowed'?'running':'failed');document.getElementById('note').textContent='仅演示状态切换，未提交审批、执行命令或更改权限。'});const u=new URL(location.href);u.searchParams.set('state',state);history.replaceState(null,'',u);}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>show(b.dataset.state));document.getElementById('theme').onclick=()=>document.documentElement.classList.toggle('dark');const p=new URLSearchParams(location.search);if(p.get('theme')==='dark')document.documentElement.classList.add('dark');show(p.get('state')||'running');
</script></html>
